<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useMemo } = React;

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ================================================================== */
/*  BOOKNOOK — a cozy, private, lofi book library for five people      */
/*  Data (books, ratings, comments) lives in one JSON file on Vercel   */
/*  Blob. Uploaded PDFs/EPUBs live in Vercel Blob too. No database.    */
/* ================================================================== */

const VALID_NAMES = ["Ferreli", "Jean", "Ernest", "Rush", "Paula"];
const SESSION_KEY = "booknook_user";

async function apiGet() {
  const res = await fetch("/api/data");
  if (!res.ok) throw new Error("Could not load the library (" + res.status + ")");
  return res.json();
}

async function apiSave(db) {
  const res = await fetch("/api/data", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(db),
  });
  if (!res.ok) throw new Error("Could not save (" + res.status + ")");
  return res.json();
}

async function apiUpload(file) {
  const ext = file.name.split(".").pop().toLowerCase();
  const res = await fetch("/api/upload", {
    method: "POST",
    headers: {
      "Content-Type": file.type || "application/octet-stream",
      "X-Filename": encodeURIComponent(file.name),
    },
    body: file,
  });
  if (!res.ok) throw new Error("Upload failed (" + res.status + ")");
  const data = await res.json();
  return { url: data.url, fileType: ext === "epub" ? "epub" : "pdf" };
}

async function apiDeleteFile(fileUrl) {
  try {
    await fetch("/api/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: fileUrl }),
    });
  } catch (e) { /* file cleanup failing shouldn't block removing it from the shelf */ }
}

function uid() {
  return "b" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* Renders page 1 of a PDF File to a small dataURL, for a cute cover thumbnail.
   Runs entirely client-side, before upload. EPUBs get a generated placeholder
   instead — extracting a persistent cover image from an EPUB isn't worth the
   complexity for a 5-person shelf. */
async function makePdfThumbnail(file) {
  try {
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 0.4 });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    return canvas.toDataURL("image/jpeg", 0.72);
  } catch (e) {
    return null;
  }
}

/* Compresses a user-picked cover photo down to a small dataURL, so a phone
   photo doesn't bloat the shared database. */
async function resizeImageToDataUrl(file, maxW = 400) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, maxW / bitmap.width);
  const w = Math.round(bitmap.width * scale);
  const h = Math.round(bitmap.height * scale);
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);
  return canvas.toDataURL("image/jpeg", 0.82);
}

const COVER_PALETTES = [
  ["#6a4c93", "#d17a9e"], ["#2b2d5e", "#8a6fae"], ["#c96a86", "#f2a65a"],
  ["#3d5a80", "#98c1d9"], ["#7a5980", "#e8b4b8"], ["#4a3f6b", "#c96a86"],
];
function paletteFor(seed) {
  let h = 0;
  for (const ch of seed) h = (h * 31 + ch.charCodeAt(0)) % COVER_PALETTES.length;
  return COVER_PALETTES[h];
}

/* ============================= SHELL ============================== */

class Boundary extends React.Component {
  constructor(props) { super(props); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  componentDidCatch(err, info) { console.error("BookNook crashed:", err, info); }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div className="bn-crash">
        <div className="bn-crash-card">
          <p className="bn-eyebrow">Something broke</p>
          <h2>This page hit a snag</h2>
          <p className="bn-crash-msg">{String(this.state.err && this.state.err.message)}</p>
          <p className="bn-crash-hint">Reloading starts fresh — anything already saved to the shelf is untouched.</p>
          <button className="bn-btn bn-btn-primary" onClick={() => window.location.reload()}>Reload</button>
        </div>
      </div>
    );
  }
}

function BookNookRoot() {
  const [user, setUser] = useState(() => sessionStorage.getItem(SESSION_KEY) || "");
  if (!user) return <Login onLogin={(n) => { sessionStorage.setItem(SESSION_KEY, n); setUser(n); }} />;
  return <Library user={user} onLogout={() => { sessionStorage.removeItem(SESSION_KEY); setUser(""); }} />;
}

function Login({ onLogin }) {
  return (
    <div className="bn-login">
      <div className="bn-login-glow" />
      <div className="bn-login-card">
        <div className="bn-login-mark">📖</div>
        <h1>BookNook</h1>
        <p>Who's reading?</p>
        <div className="bn-namepick">
          {VALID_NAMES.map((n) => (
            <button key={n} className="bn-namepick-btn" onClick={() => onLogin(n)}>{n}</button>
          ))}
        </div>
      </div>
    </div>
  );
}

function Library({ user, onLogout }) {
  const [db, setDb] = useState(null);
  const [error, setError] = useState("");
  const [showUpload, setShowUpload] = useState(false);
  const [openBook, setOpenBook] = useState(null);
  const [query, setQuery] = useState("");

  async function refresh() {
    try { setDb(await apiGet()); } catch (e) { setError(e.message); }
  }
  useEffect(() => { refresh(); }, []);

  async function addBook(meta) {
    const next = { ...db, books: [...db.books, meta] };
    setDb(next);
    try { await apiSave(next); } catch (e) { setError("Couldn't save that: " + e.message); }
  }

  async function updateBook(bookId, patch) {
    const next = { ...db, books: db.books.map((b) => (b.id === bookId ? { ...b, ...patch } : b)) };
    setDb(next);
    try { await apiSave(next); } catch (e) { setError("Couldn't save that: " + e.message); }
  }

  function rateBook(book, n) {
    updateBook(book.id, { ratings: { ...book.ratings, [user]: n } });
  }
  function addComment(book, text) {
    if (!text.trim()) return;
    const next = [{ user, text: text.trim(), ts: Date.now() }, ...(book.comments || [])];
    updateBook(book.id, { comments: next });
  }
  function toggleMustRead(book) {
    const mr = { ...(book.mustReadBy || {}) };
    if (mr[user]) delete mr[user]; else mr[user] = true;
    updateBook(book.id, { mustReadBy: mr });
  }

  function addQuote(book, text) {
    if (!text || !text.trim()) return;
    const next = [{ user, text: text.trim(), ts: Date.now() }, ...(book.quotes || [])];
    updateBook(book.id, { quotes: next });
  }

  async function deleteBook(book) {
    if (!window.confirm("Remove \"" + book.title + "\" from the shelf? This can't be undone.")) return;
    const next = { ...db, books: db.books.filter((b) => b.id !== book.id) };
    setDb(next);
    if (openBook === book.id) setOpenBook(null);
    try {
      await apiSave(next);
      await apiDeleteFile(book.url);
    } catch (e) { setError("Couldn't fully delete that: " + e.message); }
  }

  if (error) return <div className="bn-shell"><p className="bn-error">{error}</p></div>;
  if (!db) return <div className="bn-shell"><p className="bn-loading">Fluffing the reading pillows…</p></div>;

  if (openBook) {
    const book = db.books.find((b) => b.id === openBook);
    if (book) return <Reader book={book} user={user} onClose={() => setOpenBook(null)}
      onUpdate={(patch) => updateBook(book.id, patch)}
      onDelete={() => deleteBook(book)} onQuote={(text) => addQuote(book, text)} />;
  }

  const q = query.trim().toLowerCase();
  const matches = (b) => !q || [b.title, b.author, b.addedBy].filter(Boolean).some((s) => s.toLowerCase().includes(q));
  const filtered = db.books.filter(matches);
  const mustReads = filtered.filter((b) => b.mustReadBy && Object.keys(b.mustReadBy).length > 0);
  const rest = filtered.filter((b) => !(b.mustReadBy && Object.keys(b.mustReadBy).length > 0));

  const cardProps = { user, onRate: rateBook, onComment: addComment, onToggleMustRead: toggleMustRead, onDelete: deleteBook };

  return (
    <div className="bn-shell">
      <div className="bn-scene" aria-hidden="true">
        <div className="bn-scene-glow" />
        <div className="bn-scene-hill bn-scene-hill-back" />
        <div className="bn-scene-hill bn-scene-hill-front" />
      </div>
      <header className="bn-header">
        <div>
          <p className="bn-eyebrow">Welcome back</p>
          <h1>Hi, {user} 🌙</h1>
        </div>
        <div className="bn-header-actions">
          <button className="bn-btn bn-btn-primary" onClick={() => setShowUpload(true)}>+ Add a book</button>
        </div>
      </header>

      <div className="bn-search">
        <span className="bn-search-icon">🔍</span>
        <input value={query} onChange={(e) => setQuery(e.target.value)}
          placeholder="Search by title, author, or who added it…" />
      </div>

      {db.books.length === 0 ? (
        <div className="bn-empty">
          <p>The shelf is empty so far. Be the first to add something cozy to read.</p>
        </div>
      ) : filtered.length === 0 ? (
        <div className="bn-empty"><p>Nothing matches "{query}".</p></div>
      ) : (
        <React.Fragment>
          {mustReads.length > 0 && (
            <section className="bn-section">
              <h2 className="bn-section-title">⭐ Must read</h2>
              <div className="bn-grid">
                {mustReads.map((b) => <BookCard key={b.id} book={b} onOpen={() => setOpenBook(b.id)} {...cardProps} />)}
              </div>
            </section>
          )}
          <section className="bn-section">
            {mustReads.length > 0 && <h2 className="bn-section-title">📚 Everything else</h2>}
            <div className="bn-grid">
              {rest.map((b) => <BookCard key={b.id} book={b} onOpen={() => setOpenBook(b.id)} {...cardProps} />)}
            </div>
          </section>
        </React.Fragment>
      )}

      {showUpload && (
        <UploadModal onClose={() => setShowUpload(false)} user={user}
          onDone={async (meta) => { await addBook(meta); setShowUpload(false); }} />
      )}
    </div>
  );
}

function avgHearts(book) {
  const vals = Object.values(book.ratings || {});
  if (!vals.length) return 0;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function BookCard({ book, onOpen, user, onRate, onComment, onToggleMustRead, onDelete }) {
  const [c1, c2] = paletteFor(book.title || book.id);
  const [showComments, setShowComments] = useState(false);
  const [draft, setDraft] = useState("");
  const isMustRead = !!(book.mustReadBy && book.mustReadBy[user]);
  const comments = book.comments || [];

  function stop(e) { e.stopPropagation(); }

  return (
    <div className="bn-card">
      <button className="bn-card-cover-btn" onClick={onOpen}>
        <div className="bn-cover" style={book.cover ? { backgroundImage: "url(" + book.cover + ")" } : { backgroundImage: "linear-gradient(155deg," + c1 + "," + c2 + ")" }}>
          {!book.cover && <span className="bn-cover-emoji">{book.fileType === "epub" ? "📕" : "📘"}</span>}
        </div>
      </button>
      <button className={"bn-mustread-btn" + (isMustRead ? " is-on" : "")} onClick={(e) => { stop(e); onToggleMustRead(book); }} title="Must read">
        {isMustRead ? "⭐" : "☆"}
      </button>
      <button className="bn-delete-btn" onClick={(e) => { stop(e); onDelete(book); }} title="Remove from shelf">🗑</button>
      <div className="bn-card-body">
        <button className="bn-card-title-btn" onClick={onOpen}>
          <p className="bn-card-title">{book.title}</p>
          {book.author && <p className="bn-card-author">{book.author}</p>}
        </button>
        <p className="bn-card-uploader">Added by {book.addedBy}</p>
        <div onClick={stop}>
          <HeartRow value={book.ratings?.[user] || 0} onChange={(n) => onRate(book, n)} size="card" />
        </div>
        <button className="bn-comments-toggle" onClick={(e) => { stop(e); setShowComments(!showComments); }}>
          💬 {comments.length > 0 ? comments.length + " comment" + (comments.length === 1 ? "" : "s") : "Add a comment"}
        </button>
        {showComments && (
          <div className="bn-card-comments" onClick={stop}>
            <div className="bn-comment-input">
              <input value={draft} onChange={(e) => setDraft(e.target.value)}
                onKeyDown={(e) => { if (e.key === "Enter") { onComment(book, draft); setDraft(""); } }}
                placeholder="I love this! ♥" />
              <button className="bn-btn bn-btn-primary bn-btn-sm" onClick={() => { onComment(book, draft); setDraft(""); }}>Post</button>
            </div>
            {comments.map((c, i) => (
              <div key={i} className="bn-comment">
                <strong>{c.user}</strong> <span className="bn-comment-ts">{new Date(c.ts).toLocaleDateString()}</span>
                <p>{c.text}</p>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function HeartRow({ value, onChange, readOnly, size = "md" }) {
  const full = Math.round(value);
  return (
    <div className={"bn-hearts bn-hearts-" + size}>
      {[1, 2, 3, 4, 5].map((n) => (
        <span key={n}
          className={"bn-heart" + (n <= full ? " is-full" : "") + (readOnly ? "" : " is-click")}
          onClick={readOnly ? undefined : () => onChange(n)}>
          {n <= full ? "♥" : "♡"}
        </span>
      ))}
    </div>
  );
}

function UploadModal({ onClose, onDone, user }) {
  const [title, setTitle] = useState("");
  const [author, setAuthor] = useState("");
  const [file, setFile] = useState(null);
  const [coverFile, setCoverFile] = useState(null);
  const [coverPreview, setCoverPreview] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  function pickFile(f) {
    if (!f) return;
    const ext = f.name.split(".").pop().toLowerCase();
    if (ext !== "pdf" && ext !== "epub") { setError("Only PDF or EPUB files, please."); return; }
    setError("");
    setFile(f);
    if (!title) setTitle(f.name.replace(/\.(pdf|epub)$/i, ""));
  }

  function pickCover(f) {
    if (!f) return;
    if (!f.type.startsWith("image/")) { setError("Cover has to be an image."); return; }
    setError("");
    setCoverFile(f);
    setCoverPreview(URL.createObjectURL(f));
  }

  async function submit() {
    if (!file) { setError("Choose a PDF or EPUB first."); return; }
    if (!title.trim()) { setError("Give it a title."); return; }
    setBusy(true); setError("");
    try {
      let cover = null;
      if (coverFile) cover = await resizeImageToDataUrl(coverFile);
      else if (file.name.toLowerCase().endsWith(".pdf")) cover = await makePdfThumbnail(file);
      const { url, fileType } = await apiUpload(file);
      onDone({
        id: uid(), title: title.trim(), author: author.trim(), url, fileType,
        cover, addedBy: user, addedAt: Date.now(),
        ratings: {}, comments: [], quotes: [], mustReadBy: {},
      });
    } catch (e) { setError(e.message || "Something went wrong uploading that."); }
    setBusy(false);
  }

  return (
    <div className="bn-modal-overlay" onClick={onClose}>
      <div className="bn-modal" onClick={(e) => e.stopPropagation()}>
        <h2>Add a book to the shelf</h2>
        <label className="bn-drop" onDragOver={(e) => e.preventDefault()} onDrop={(e) => { e.preventDefault(); pickFile(e.dataTransfer.files[0]); }}>
          <input type="file" accept=".pdf,.epub" onChange={(e) => pickFile(e.target.files[0])} hidden />
          {file ? <span>📄 {file.name}</span> : <span>Drop a PDF or EPUB here, or click to choose</span>}
        </label>

        <label className="bn-field"><span>Title</span>
          <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="The book's title" />
        </label>
        <label className="bn-field"><span>Author (optional)</span>
          <input value={author} onChange={(e) => setAuthor(e.target.value)} placeholder="Who wrote it" />
        </label>

        <label className="bn-field"><span>Cover photo (optional)</span>
          <div className="bn-cover-picker">
            {coverPreview
              ? <img src={coverPreview} className="bn-cover-preview" />
              : <div className="bn-cover-preview bn-cover-preview-empty">No cover yet</div>}
            <label className="bn-btn bn-btn-ghost bn-btn-sm bn-cover-pick-btn">
              Choose photo
              <input type="file" accept="image/*" onChange={(e) => pickCover(e.target.files[0])} hidden />
            </label>
          </div>
          <span className="bn-cover-hint">PDFs get an automatic cover from page one if you skip this.</span>
        </label>

        {error && <p className="bn-login-error">{error}</p>}
        <div className="bn-modal-actions">
          <button className="bn-btn bn-btn-ghost" onClick={onClose} disabled={busy}>Cancel</button>
          <button className="bn-btn bn-btn-primary" onClick={submit} disabled={busy}>{busy ? "Adding…" : "Add to shelf"}</button>
        </div>
      </div>
    </div>
  );
}

/* ============================= READER =============================== */

const FONTS = [
  { id: "quicksand", label: "Quicksand (cozy)", stack: "'Quicksand', sans-serif" },
  { id: "nunito", label: "Nunito (clean)", stack: "'Nunito', sans-serif" },
  { id: "georgia", label: "Georgia (classic)", stack: "Georgia, 'Times New Roman', serif" },
];
const BG_PRESETS = [
  { id: "cream", label: "Cream", color: "#FBF3E9" },
  { id: "sage", label: "Sage", color: "#E7EFE3" },
  { id: "blush", label: "Blush", color: "#F7E9EE" },
  { id: "night", label: "Night", color: "#221C33" },
];

function readerPrefsKey(user) { return "booknook_reader_" + user; }
function loadPrefs(user) {
  try { return JSON.parse(localStorage.getItem(readerPrefsKey(user))) || {}; } catch (e) { return {}; }
}
function savePrefs(user, prefs) {
  localStorage.setItem(readerPrefsKey(user), JSON.stringify(prefs));
}

function Reader({ book, user, onClose, onUpdate, onDelete, onQuote }) {
  const initial = loadPrefs(user);
  const [bg, setBg] = useState(initial.bg || "cream");
  const [font, setFont] = useState(initial.font || "quicksand");
  const [margin, setMargin] = useState(initial.margin ?? 48);
  const [fontSize, setFontSize] = useState(initial.fontSize ?? 100);
  const [lineHeight, setLineHeight] = useState(initial.lineHeight ?? 1.6);
  const [textAlign, setTextAlign] = useState(initial.textAlign || "left");
  const [flow, setFlow] = useState(initial.flow || "paginated");
  const [showSettings, setShowSettings] = useState(false);
  const [showQuotes, setShowQuotes] = useState(false);
  const [comment, setComment] = useState("");
  const [quoteDraft, setQuoteDraft] = useState("");
  const [progress, setProgress] = useState(null);

  useEffect(() => {
    savePrefs(user, { bg, font, margin, fontSize, lineHeight, textAlign, flow });
  }, [bg, font, margin, fontSize, lineHeight, textAlign, flow]);

  const bgColor = (BG_PRESETS.find((b) => b.id === bg) || BG_PRESETS[0]).color;
  const fontStack = (FONTS.find((f) => f.id === font) || FONTS[0]).stack;
  const isDark = bg === "night";
  const textColor = isDark ? "#EDE6F5" : "#3A2E39";
  const quotes = book.quotes || [];
  const isEpub = book.fileType === "epub";
  const zoom = fontSize / 100;

  function rate(n) {
    onUpdate({ ratings: { ...book.ratings, [user]: n } });
  }
  function submitComment() {
    if (!comment.trim()) return;
    const next = [{ user, text: comment.trim(), ts: Date.now() }, ...(book.comments || [])];
    onUpdate({ comments: next });
    setComment("");
  }
  function saveQuote() {
    if (!quoteDraft.trim()) return;
    onQuote(quoteDraft.trim());
    setQuoteDraft("");
  }

  const quotesByUser = React.useMemo(() => {
    const groups = {};
    quotes.forEach((q) => { (groups[q.user] = groups[q.user] || []).push(q); });
    return groups;
  }, [quotes]);

  let progressPct = null, progressLabel = "";
  if (progress) {
    if (progress.percent !== undefined) {
      progressPct = Math.round(progress.percent * 100);
      progressLabel = progressPct + "% through";
    } else if (progress.total) {
      progressPct = Math.round((progress.page / progress.total) * 100);
      progressLabel = "Page " + progress.page + " of " + progress.total;
    }
  }

  return (
    <div className="bn-reader">
      <div className="bn-reader-top">
        <button className="bn-btn bn-btn-ghost" onClick={onClose}>← Back to shelf</button>
        <div className="bn-reader-title">
          <strong>{book.title}</strong>{book.author ? " · " + book.author : ""}
        </div>
        <div className="bn-reader-top-actions">
          <button className="bn-btn bn-btn-ghost" onClick={() => setShowQuotes(!showQuotes)}>

function PdfView({ url, viewMode = "paginated", zoom = 1, onProgress }) {
  const [numPages, setNumPages] = useState(0);
  const [page, setPage] = useState(1);
  const [error, setError] = useState("");
  const canvasRef = useRef(null);
  const pdfRef = useRef(null);
  const scrollRef = useRef(null);
  const pageCanvasRefs = useRef({});

  useEffect(() => {
    let cancelled = false;
    pdfjsLib.getDocument(url).promise.then((pdf) => {
      if (cancelled) return;
      pdfRef.current = pdf;
      setNumPages(pdf.numPages);
      setPage(1);
    }).catch((e) => { if (!cancelled) setError(e && e.message ? e.message : "Could not open this PDF."); });
    return () => { cancelled = true; };
  }, [url]);

  // Paginated mode: render the current page only.
  useEffect(() => {
    if (viewMode !== "paginated" || !pdfRef.current || !canvasRef.current) return;
    let cancelled = false;
    pdfRef.current.getPage(page).then((p) => {
      if (cancelled) return;
      const viewport = p.getViewport({ scale: 1.3 * zoom });
      const canvas = canvasRef.current;
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      p.render({ canvasContext: canvas.getContext("2d"), viewport });
    }).catch((e) => { if (!cancelled) setError(e && e.message ? e.message : "Could not render this page."); });
    return () => { cancelled = true; };
  }, [page, numPages, viewMode, zoom]);

  useEffect(() => {
    if (viewMode === "paginated" && onProgress) onProgress(page, numPages);
  }, [page, numPages, viewMode]);

  // Scroll mode: render every page into its own stacked canvas.
  useEffect(() => {
    if (viewMode !== "scroll" || !pdfRef.current || numPages === 0) return;
    let cancelled = false;
    (async () => {
      for (let i = 1; i <= numPages; i++) {
        if (cancelled) return;
        const canvas = pageCanvasRefs.current[i];
        if (!canvas) continue;
        const p = await pdfRef.current.getPage(i);
        if (cancelled) return;
        const viewport = p.getViewport({ scale: 1.3 * zoom });
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await p.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
      }
    })();
    return () => { cancelled = true; };
  }, [viewMode, numPages, zoom]);

  // Scroll mode: track which page is centered to report progress.
  useEffect(() => {
    if (viewMode !== "scroll" || !scrollRef.current || numPages === 0) return;
    const observer = new IntersectionObserver((entries) => {
      let best = null;
      entries.forEach((en) => {
        if (en.isIntersecting && (!best || en.intersectionRatio > best.intersectionRatio)) best = en;
      });
      if (best) {
        const idx = Number(best.target.dataset.page);
        setPage(idx);
        if (onProgress) onProgress(idx, numPages);
      }
    }, { root: scrollRef.current, threshold: [0.5] });
    Object.values(pageCanvasRefs.current).forEach((c) => c && observer.observe(c));
    return () => observer.disconnect();
  }, [viewMode, numPages]);

  if (error) return <p className="bn-error bn-epub-error">Couldn't display this PDF — {error}. Try re-adding it.</p>;

  if (viewMode === "scroll") {
    return (
      <div className="bn-pdf-scroll" ref={scrollRef}>
        {Array.from({ length: numPages }, (_, i) => i + 1).map((n) => (
          <canvas key={n} data-page={n} ref={(el) => { pageCanvasRefs.current[n] = el; }} className="bn-pdf-canvas bn-pdf-canvas-scroll" />
        ))}
      </div>
    );
  }

  return (
    <div className="bn-pdf">
      <canvas ref={canvasRef} className="bn-pdf-canvas" />
      {numPages > 0 && (
        <div className="bn-pdf-nav">
          <button className="bn-btn bn-btn-ghost bn-btn-sm" disabled={page <= 1} onClick={() => setPage((p) => p - 1)}>‹ Prev</button>
          <span>Page {page} of {numPages}</span>
          <button className="bn-btn bn-btn-ghost bn-btn-sm" disabled={page >= numPages} onClick={() => setPage((p) => p + 1)}>Next ›</button>
        </div>
      )}
    </div>
  );
}

function EpubView({ url, fontStack, bgColor, textColor, fontSize = 100, lineHeight = 1.6, textAlign = "left", flow = "paginated", onSelect, onProgress }) {
  const viewerRef = useRef(null);
  const renditionRef = useRef(null);
  const [status, setStatus] = useState("loading"); // loading | ready | error
  const [errMsg, setErrMsg] = useState("");

  useEffect(() => {
    if (!viewerRef.current) return;
    setStatus("loading"); setErrMsg("");
    let cancelled = false;
    let book;
    const timeout = setTimeout(() => {
      if (!cancelled) { setStatus("error"); setErrMsg("Timed out opening the file — it may not be a valid EPUB."); }
    }, 15000);
    try {
      book = ePub(url);
      const rendition = book.renderTo(viewerRef.current, {
        width: "100%", height: "70vh",
        flow: flow === "scroll" ? "scrolled-doc" : "paginated",
      });
      rendition.themes.default({
        body: {
          background: bgColor + " !important", color: textColor + " !important",
          "font-family": fontStack + " !important", "line-height": lineHeight + " !important",
          "text-align": textAlign + " !important",
        },
      });
      rendition.themes.fontSize(fontSize + "%");
      rendition.on("selected", (cfiRange, contents) => {
        const sel = contents.window.getSelection ? contents.window.getSelection().toString() : "";
        if (sel && sel.trim() && onSelect) onSelect(sel.trim());
      });
      rendition.on("relocated", (location) => {
        if (book.locations && book.locations.length() && onProgress) {
          onProgress(book.locations.percentageFromCfi(location.start.cfi));
        }
      });
      rendition.on("rendered", () => { if (!cancelled) { clearTimeout(timeout); setStatus("ready"); } });
      rendition.display().then(() => {
        if (cancelled) return;
        clearTimeout(timeout); setStatus("ready");
        book.ready.then(() => book.locations.generate(600)).then(() => {
          if (cancelled) return;
          const loc = rendition.currentLocation();
          if (loc && loc.start && onProgress) onProgress(book.locations.percentageFromCfi(loc.start.cfi));
        }).catch(() => {});
      }).catch((e) => { if (!cancelled) { clearTimeout(timeout); setStatus("error"); setErrMsg(e && e.message ? e.message : "Could not open this EPUB."); } });
      renditionRef.current = rendition;
    } catch (e) {
      clearTimeout(timeout);
      setStatus("error"); setErrMsg(e && e.message ? e.message : "Could not open this EPUB.");
    }
    return () => { cancelled = true; clearTimeout(timeout); if (book) book.destroy(); };
  }, [url]);

  useEffect(() => {
    if (renditionRef.current) {
      renditionRef.current.themes.default({
        body: {
          background: bgColor + " !important", color: textColor + " !important",
          "font-family": fontStack + " !important", "line-height": lineHeight + " !important",
          "text-align": textAlign + " !important",
        },
      });
    }
  }, [bgColor, textColor, fontStack, lineHeight, textAlign]);

  useEffect(() => {
    if (renditionRef.current) renditionRef.current.themes.fontSize(fontSize + "%");
  }, [fontSize]);

  useEffect(() => {
    if (renditionRef.current && status === "ready") {
      renditionRef.current.flow(flow === "scroll" ? "scrolled-doc" : "paginated");
    }
  }, [flow]);

  return (
    <div className="bn-epub">
      {status === "loading" && <p className="bn-loading">Opening the book…</p>}
      {status === "error" && (
        <p className="bn-error bn-epub-error">
          Couldn't display this EPUB — {errMsg}. The file may not have uploaded fully; try re-adding it.
        </p>
      )}
      <div ref={viewerRef} className="bn-epub-viewer" style={{ display: status === "error" ? "none" : "block" }} />
      {status === "ready" && flow !== "scroll" && (
        <div className="bn-epub-nav">
          <button className="bn-btn bn-btn-ghost bn-btn-sm" onClick={() => renditionRef.current && renditionRef.current.prev()}>‹ Prev</button>
          <span className="bn-epub-hint">Select text to quote it →</span>
          <button className="bn-btn bn-btn-ghost bn-btn-sm" onClick={() => renditionRef.current && renditionRef.current.next()}>Next ›</button>
        </div>
      )}
    </div>
  );
}

/* ---------- Modal ---------- */
.bn-modal-overlay { position: fixed; inset: 0; background: rgba(32,25,51,0.55); display: flex; align-items: center; justify-content: center; z-index: 40; padding: 20px; }
.bn-modal { background: #fff; border-radius: 22px; padding: 30px; width: 420px; max-width: 100%; }
.bn-modal h2 { font-size: 20px; margin: 0 0 18px; color: var(--night); }
.bn-drop {
  display: flex; align-items: center; justify-content: center; text-align: center; border: 2px dashed var(--line);
  border-radius: 16px; padding: 24px; font-size: 13.5px; color: var(--soft); margin-bottom: 16px; cursor: pointer;
}
.bn-field { display: block; margin-bottom: 14px; }
.bn-field span { display: block; font-size: 11.5px; font-weight: 700; color: var(--soft); margin-bottom: 4px; }
.bn-field input { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.bn-modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }

/* ---------- Reader ---------- */
.bn-reader { min-height: 100vh; background: var(--cream); }
.bn-reader-top { display: flex; align-items: center; justify-content: space-between; padding: 18px 30px; gap: 12px; }
.bn-reader-title { font-size: 14px; text-align: center; }
.bn-reader-top-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.bn-delete-reader-btn:hover { border-color: #C0424F; color: #C0424F; }
.bn-reader-settings {
  display: flex; gap: 34px; padding: 16px 30px; background: rgba(255,255,255,0.6); flex-wrap: wrap;
}
.bn-settings-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; opacity: .7; margin: 0 0 8px; }
.bn-swatches { display: flex; gap: 8px; }
.bn-swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.15); }
.bn-swatch.is-on { outline: 2px solid var(--sunset); outline-offset: 2px; }
.bn-toggle-row { display: flex; gap: 6px; }
.bn-toggle-btn { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; color: var(--ink); }
.bn-toggle-btn.is-on { background: var(--dusk); border-color: var(--dusk); color: #fff; }

.bn-progress { display: flex; align-items: center; gap: 12px; padding: 0 30px 14px; }
.bn-progress-bar { flex: 1; height: 6px; background: rgba(0,0,0,0.08); border-radius: 3px; overflow: hidden; }
.bn-progress-fill { height: 100%; background: linear-gradient(90deg, var(--dusk), var(--sunset)); border-radius: 3px; transition: width .3s ease; }
.bn-progress-label { font-size: 11.5px; color: var(--soft); white-space: nowrap; }

.bn-reader-layout { display: flex; align-items: flex-start; gap: 0; }
.bn-reader-main { flex: 1; min-width: 0; }
.bn-book-surface {
  max-width: 860px; margin: 6px auto 0; border-radius: 22px; padding-top: 30px; padding-bottom: 34px;
  min-height: 320px; box-shadow: 0 16px 40px rgba(32,25,51,0.14); transition: background .2s ease, color .2s ease;
}
.bn-reader-footer { max-width: 820px; margin: 20px auto 0; padding: 24px 6px 60px; border-top: 1px solid var(--line); }
.bn-rate-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; font-size: 14px; }
.bn-rate-avg { opacity: .65; font-size: 12.5px; }
.bn-comment-input { display: flex; gap: 8px; margin-bottom: 16px; }
.bn-comment-input input { flex: 1; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.bn-comment { padding: 10px 0; border-top: 1px solid rgba(0,0,0,0.08); font-size: 13.5px; }
.bn-comment-ts { opacity: .5; font-size: 11px; }
.bn-comment p { margin: 4px 0 0; }

.bn-quotes-panel {
  width: 300px; flex-shrink: 0; background: rgba(255,255,255,0.55); backdrop-filter: blur(6px);
  border-left: 1px solid rgba(0,0,0,0.08); padding: 22px 20px; min-height: calc(100vh - 70px);
}
.bn-quotes-title { font-family: 'Quicksand', sans-serif; font-weight: 700; font-size: 15px; margin: 0 0 16px; }
.bn-quote-add { margin-bottom: 22px; }
.bn-quote-add textarea { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 13px; resize: vertical; margin-bottom: 8px; font-family: inherit; }
.bn-quotes-empty { font-size: 12.5px; opacity: .6; font-style: italic; }
.bn-quote-group { margin-bottom: 18px; }
.bn-quote-name { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--sunset); margin: 0 0 8px; }
.bn-quote-item { margin: 0 0 10px; padding: 8px 0 8px 12px; border-left: 3px solid var(--dusk); font-size: 13px; font-style: italic; line-height: 1.4; }

/* ---------- PDF / EPUB viewers ---------- */
.bn-pdf { display: flex; flex-direction: column; align-items: center; }
.bn-pdf-canvas { max-width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border-radius: 4px; }
.bn-pdf-nav { display: flex; gap: 16px; align-items: center; margin-top: 16px; font-size: 13px; }
.bn-pdf-scroll { display: flex; flex-direction: column; align-items: center; gap: 18px; max-height: 74vh; overflow-y: auto; padding: 4px 4px 20px; }
.bn-pdf-canvas-scroll { max-width: 100%; box-shadow: 0 8px 20px rgba(0,0,0,0.15); border-radius: 4px; }
.bn-epub-viewer { background: transparent; min-height: 300px; }
.bn-epub-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
.bn-epub-hint { font-size: 11.5px; opacity: .55; }
.bn-epub-error { padding: 40px 20px; text-align: center; background: rgba(192,66,79,0.08); border-radius: 14px; }

@media (max-width: 900px) {
  .bn-reader-layout { flex-direction: column; }
  .bn-quotes-panel { width: 100%; min-height: 0; border-left: none; border-top: 1px solid rgba(0,0,0,0.08); }
}
@media (max-width: 720px) {
  .bn-shell { padding: 24px 18px 50px; }
  .bn-reader-top, .bn-reader-settings { padding-left: 16px; padding-right: 16px; }
}
.bn-crash { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--cream); padding: 20px; }
.bn-crash-card { background: #fff; border-radius: 22px; padding: 34px; max-width: 440px; text-align: center; box-shadow: 0 20px 50px rgba(32,25,51,0.18); }
.bn-crash-card h2 { margin: 4px 0 12px; color: var(--night); }
.bn-crash-msg { font-family: 'Courier New', monospace; font-size: 12.5px; background: #F4EAF3; border-radius: 10px; padding: 10px 12px; color: #7a4a5a; margin: 0 0 14px; word-break: break-word; }
.bn-crash-hint { font-size: 13px; color: var(--soft); margin: 0 0 20px; }
</style>
</body>
</html>
